# Read by the kit's shared scripts. Sourced by bash.
EXT_UUID=ai-usage@jackicus
EXT_NAME='AI Usage'
EXT_LOG_PREFIX='[AI Usage]'
EXT_APP_CLASS=AiUsageApp
# Shipped beyond the entry points, metadata, stylesheet and schema: DIR:PATTERN under src/.
EXT_SHIP=("lib:*.js")
EXT_CHECKS=(imports parsers)
NESTED_STRAYS=()
# Overlaid on /usr/bin under 'start --stand-in': a provider's CLI is only looked for on PATH, never run.
EXT_STAND_IN_BINS=(claude codex agy)
# Removed under 'start --stand-in': codex.js reads $CODEX_HOME, which would be the real login.
EXT_STAND_IN_UNSET=(CODEX_HOME)
EXT_TOOLS=()
